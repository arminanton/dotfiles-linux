version: 4
final_space: true
console_title_template: "{{ .Shell }} in {{ .Folder }}"

blocks:
  # =========================[ Line 1: Left Side ]=========================
  - type: prompt
    alignment: left
    segments:
      # 1. OS / WSL
      - type: os
        style: diamond
        background: "#d3d7cf"
        foreground: "#000000"
        leading_diamond: "╭─"
        template: " {{ if .WSL }}WSL at {{ end }}{{ .Icon }} "

      # 2. Path
      - type: path
        style: powerline
        background: "#3465a4"
        foreground: "#e4e4e4"
        powerline_symbol: ""
        template: "  {{ .Path }} "
        properties:
          home_icon: "~"
          style: full

      # 3. Git Status
      - type: git
        style: powerline
        background: "#4e9a06"
        foreground: "#000000"
        powerline_symbol: ""
        background_templates:
          - "{{ if or (.Working.Changed) (.Staging.Changed) }}#c4a000{{ end }}"
          - "{{ if and (gt .Ahead 0) (gt .Behind 0) }}#f26d50{{ end }}"
          - "{{ if gt .Ahead 0 }}#89d1dc{{ end }}"
          - "{{ if gt .Behind 0 }}#4e9a06{{ end }}"
        template: " {{ .UpstreamIcon }}{{ .HEAD }}{{ if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }}  {{ .Working.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }}  {{ .Staging.String }}{{ end }}{{ if gt .StashCount 0 }}  {{ .StashCount }}{{ end }} "
        properties:
          branch_icon: " "
          fetch_status: true
          fetch_upstream_icon: true

  # =========================[ Line 1: Right Side ]========================
  - type: prompt
    alignment: right
    segments:
      # 1. Node
      - type: node
        style: powerline
        background: "#689f63"
        foreground: "#ffffff"
        invert_powerline: true
        powerline_symbol: ""
        template: " {{ if .PackageManagerIcon }}{{ .PackageManagerIcon }} {{ end }}{{ .Full }}  "
        properties:
          fetch_version: true

      # 2. Go
      - type: go
        style: powerline
        background: "#00acd7"
        foreground: "#111111"
        invert_powerline: true
        powerline_symbol: ""
        template: " {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}  "
        properties:
          fetch_version: true

      # 3. Julia
      - type: julia
        style: powerline
        background: "#4063D8"
        foreground: "#111111"
        invert_powerline: true
        powerline_symbol: ""
        template: " {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}  "
        properties:
          fetch_version: true

      # 4. Python
      - type: python
        style: powerline
        background: "#FFDE57"
        foreground: "#111111"
        invert_powerline: true
        powerline_symbol: ""
        template: " {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}  "
        properties:
          display_mode: files
          fetch_virtual_env: false

      # 5. Ruby
      - type: ruby
        style: powerline
        background: "#AE1401"
        foreground: "#ffffff"
        invert_powerline: true
        powerline_symbol: ""
        template: " {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}  "
        properties:
          display_mode: files
          fetch_version: true

      # 6. Azure Functions
      - type: azfunc
        style: powerline
        background: "#FEAC19"
        foreground: "#ffffff"
        invert_powerline: true
        powerline_symbol: ""
        template: " {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} "
        properties:
          display_mode: files
          fetch_version: false

      # 7. AWS
      - type: aws
        style: powerline
        foreground: "#ffffff"
        invert_powerline: true
        powerline_symbol: ""
        background_templates:
          - "{{if contains \"default\" .Profile}}#FFA400{{end}}"
          - "{{if contains \"jan\" .Profile}}#f1184c{{end}}"
        template: " {{ .Profile }}{{ if .Region }}@{{ .Region }}{{ end }}  "
        properties:
          display_default: false

      # 8. Root Indicator
      - type: root
        style: powerline
        background: "#ffff66"
        foreground: "#111111"
        invert_powerline: true
        powerline_symbol: ""
        template: "  "

      # 9. Execution Time
      - type: executiontime
        style: powerline
        background: "#c4a000"
        foreground: "#000000"
        invert_powerline: true
        powerline_symbol: ""
        template: " {{ .FormattedMs }}  "

      # 10. Status
      - type: status
        style: powerline
        background: "#000000"
        foreground: "#d3d7cf"
        invert_powerline: true
        powerline_symbol: ""
        background_templates:
          - "{{ if gt .Code 0 }}#cc2222{{ end }}"
        template: " {{ if gt .Code 0 }}{{ reason .Code }}{{ else }}{{ end }} "
        properties:
          always_enabled: true

      # 11. Time
      - type: time
        style: diamond
        background: "#d3d7cf"
        foreground: "#000000"
        invert_powerline: true
        template: " {{ .CurrentDate | date .Format }}  "
        trailing_diamond: "─╮"

  # =========================[ Line 2 ]===================================
  - type: prompt
    alignment: left
    newline: true
    segments:
      # 1. Bottom-left frame
      - type: text
        style: plain
        foreground: "#d3d7cf"
        template: "╰─"

  # =========================[ Line 2: Right Tail ]=======================
  - type: rprompt
    segments:
      # 1. Bottom-right frame
      - type: text
        style: plain
        foreground: "#d3d7cf"
        template: "─╯"
