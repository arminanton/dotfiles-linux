version: 4
console_title_template: "{{ .Folder }}"

transient_prompt:
  background: transparent
  foreground: "#FEF5ED"
  template: "  "

blocks:
  # =========================[ Line 1: Left Side ]=========================
  - type: prompt
    alignment: left
    newline: true
    segments:
      # 1. OS / WSL
      - type: os
        style: diamond
        background: "#FEF5ED"
        foreground: "#011627"
        leading_diamond: ""
        trailing_diamond: ""
        template: " {{ if .WSL }}WSL at {{ end }}{{ .Icon }} "
        properties:
          macos: ""
          ubuntu: ""
          windows: ""

      # 2. Shell
      - type: shell
        style: diamond
        background: "#FEF5ED"
        foreground: "#011627"
        leading_diamond: ""
        trailing_diamond: "<transparent,#FEF5ED></>"
        template: "  {{ .Name }} "

      # 3. Memory / System Info
      - type: sysinfo
        style: diamond
        background: "#516BEB"
        foreground: "#ffffff"
        leading_diamond: ""
        trailing_diamond: "<transparent,#516BEB></>"
        template: "  MEM: {{ round .PhysicalPercentUsed .Precision }}% | {{ (div ((sub .PhysicalTotalMemory .PhysicalAvailableMemory)|float64) 1073741824.0) }}/{{ (div .PhysicalTotalMemory 1073741824.0) }}GB  "

      # 4. Execution Time
      - type: executiontime
        style: diamond
        background: "#575656"
        foreground: "#d6deeb"
        leading_diamond: ""
        trailing_diamond: ""
        template: " {{ .FormattedMs }} "
        properties:
          style: roundrock
          threshold: 0

  # =========================[ Line 1: Right Side ]========================
  - type: prompt
    alignment: right
    segments:
      # 1. Git Status
      - type: git
        style: diamond
        background: "#17D7A0"
        foreground: "#011627"
        leading_diamond: ""
        trailing_diamond: ""
        template: " {{ .UpstreamIcon }}{{ .HEAD }}{{ if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }}  {{ .Working.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }}  {{ .Staging.String }}{{ end }}{{ if gt .StashCount 0 }}  {{ .StashCount }}{{ end }} "
        properties:
          branch_icon: " "
          fetch_status: true
          fetch_upstream_icon: true

      # 2. Time
      - type: time
        style: plain
        template: " ♥ {{ .CurrentDate | date .Format }} |"
        properties:
          time_format: "15:04"

  # =========================[ Line 2 ]===================================
  - type: prompt
    alignment: left
    newline: true
    segments:
      # 1. Top-left frame
      - type: text
        style: plain
        template: "╭─"

      # 3. Root Indicator
      # - type: root
      #   style: plain
      #   template: "  "

      # 4. Path
      - type: path
        style: plain
        template: " {{ .Path }} "
        properties:
          folder_icon: "  "
          folder_separator_icon: "  "
          home_icon: "  "

  # =========================[ Line 3 ]===================================
  - type: prompt
    alignment: left
    newline: true
    segments:
      # 1. Prompt Line / Status
      - type: status
        style: plain
        template: "╰─ "
        properties:
          always_enabled: true
